<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Portal de pregătire pentru concursul de ofițer penitenciare – specializarea Evidență">

    <!-- Favicon SVG inline -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext x='50' y='68' font-size='50' font-family='Arial, sans-serif' font-weight='bold' text-anchor='middle' fill='%23f59e0b'%3E⚖%3C/text%3E%3C/svg%3E">

    <title>Portal Ofițer Evidență – Penitenciare</title>

    <!-- Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

    <!-- Inițializare temă înainte de randare, evitând flash-ul -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <!-- Stiluri specifice pentru header și butonul de temă -->
    <style>
        header {
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.2s ease;
            z-index: 5;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        @media (max-width: 700px) {
            .theme-toggle {
                width: 36px;
                height: 36px;
                font-size: 1rem;
                top: 0.75rem;
                right: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <button id="themeToggle" class="theme-toggle" aria-label="Comută tema întunecată">🌙</button>
        <div class="header-content">
            <span class="logo-icon" aria-hidden="true">⚖️</span>
            <h1>Portal Ofițer Evidență</h1>
            <p class="subtitle">Legislație consolidată și proceduri pentru concursul de ofițer penitenciare</p>
        </div>
    </header>

    <nav id="mainNav" aria-label="Navigare principală">
        <button data-view="modules" class="active">Legislație</button>
        <button data-view="duties">Fișa postului</button>
        <button data-view="search">Căutare</button>
    </nav>

    <main id="app" aria-live="polite"></main>

    <footer>
        <p>Pregătire pentru concursul de ofițer evidență – administrație penitenciară</p>
    </footer>

    <script>
        if (!location.hash) {
            location.hash = '#/modules';
        }
    </script>

    <script src="js/data/manifest.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
